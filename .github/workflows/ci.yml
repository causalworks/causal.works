name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_pw
      TEST_DATABASE_URL: postgres://postgres:ci_pw@localhost:5432/causal_ci
      SMOKE_DATABASE_URL: postgres://causal_app:ci_app_pw@localhost:5432/causal_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the test database from db/schema.sql
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE causal_app LOGIN PASSWORD 'ci_app_pw'"
          psql -h localhost -U postgres -c "CREATE DATABASE causal_ci"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -d causal_ci -f db/schema.sql
      - name: Route access audit
        run: npm run audit:routes
      - name: Tests
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          tail -n 15 test-output.txt
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E "^(not ok|\s+not ok|\s+error:|\s+code:|\s+message:)" test-output.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failing tests::${summary}"
          fi
          exit $code

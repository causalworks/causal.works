<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Membership — causalworks</title>
  <meta name="theme-color" content="#800020">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/organizational/css/organizational.css">
</head>
<body class="organizational-app" data-organizational-active="membership">
  <div id="app-header"></div>

  <div class="organizational-workspace">
    <div id="organizational-sidebar-mount"></div>
    <div class="organizational-workspace-main">
      <main class="organizational-main organizational-main-wide">
        <p id="organizational-org-error" class="organizational-error" hidden></p>
        <div id="organizational-org-loading" class="organizational-empty">Loading membership…</div>

        <div id="organizational-org-dashboard" hidden>
          <h1 class="organizational-org-dashboard-title" id="organizational-org-title">Membership</h1>

          <div class="organizational-tabs" role="tablist">
            <button type="button" class="organizational-tab" data-membership-tab="members" hidden>Dues members</button>
            <button type="button" class="organizational-tab" data-membership-tab="renewals" hidden>Renewals</button>
            <button type="button" class="organizational-tab" data-membership-tab="summary">Summary</button>
            <button type="button" class="organizational-tab" data-membership-tab="tiers">Tiers</button>
            <button type="button" class="organizational-tab" data-membership-tab="settings" hidden>Settings</button>
          </div>

          <section id="membership-tab-members" class="organizational-tab-content">
            <div class="organizational-grants-head organizational-membership-toolbar" style="margin-top:12px;justify-content:space-between;flex-wrap:wrap;gap:8px;">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <input type="text" id="membership-search" class="organizational-input" placeholder="Search name or email…" style="width:220px;">
                <select id="membership-filter-status" class="organizational-input" style="width:140px;">
                  <option value="">All statuses</option>
                  <option value="active">Active</option>
                  <option value="pending">Pending</option>
                  <option value="grace">Grace</option>
                  <option value="lapsed">Lapsed</option>
                  <option value="ended">Ended</option>
                </select>
                <select id="membership-filter-tier" class="organizational-input" style="width:160px;"><option value="">All tiers</option></select>
                <select id="membership-filter-kind" class="organizational-input" style="width:180px;">
                  <option value="">People and organizations</option>
                  <option value="individual">People</option>
                  <option value="organization">Organizations</option>
                </select>
              </div>
              <div style="display:flex;gap:8px;">
                <a href="#" id="membership-export" class="organizational-btn organizational-btn-secondary" hidden>Export CSV</a>
                <button type="button" class="organizational-btn organizational-btn-primary" id="membership-add" hidden>+ Add dues member</button>
              </div>
            </div>
            <section class="organizational-card" id="membership-join-requests" style="margin-top:12px;" hidden>
              <h2 class="organizational-membership-section" style="margin-top:0;">Join requests waiting for approval</h2>
              <div class="organizational-table-wrap"><table class="organizational-table" aria-label="Join requests"><tbody id="membership-join-tbody"></tbody></table></div>
            </section>
            <section class="organizational-card organizational-card-flush" style="margin-top:12px;">
              <div class="organizational-table-wrap">
                <table class="organizational-table" aria-label="Dues members">
                  <thead><tr><th>Name</th><th>Status</th><th>Tier</th><th>Term ends</th><th>Owed</th><th>Last contact</th></tr></thead>
                  <tbody id="membership-members-tbody"><tr class="organizational-table-empty"><td colspan="6">Loading…</td></tr></tbody>
                </table>
              </div>
            </section>
          </section>

          <section id="membership-tab-renewals" class="organizational-tab-content">
            <div class="organizational-grants-head organizational-membership-toolbar" style="margin-top:12px;flex-wrap:wrap;gap:8px;">
              <label class="organizational-hint">Ends within
                <select id="renewals-days" class="organizational-input" style="width:110px;">
                  <option value="30">30 days</option><option value="60" selected>60 days</option><option value="90">90 days</option><option value="180">180 days</option>
                </select></label>
              <label class="organizational-hint">Tier <select id="renewals-tier" class="organizational-input" style="width:160px;"><option value="">All tiers</option></select></label>
              <label class="organizational-hint">No contact for
                <select id="renewals-contact" class="organizational-input" style="width:120px;">
                  <option value="">Any</option><option value="14">14 days</option><option value="30">30 days</option><option value="60">60 days</option>
                </select></label>
            </div>
            <section class="organizational-card organizational-card-flush" style="margin-top:12px;">
              <div class="organizational-table-wrap">
                <table class="organizational-table" aria-label="Renewals">
                  <thead><tr><th>Name</th><th>Status</th><th>Tier</th><th>Term ends</th><th>Days</th><th>Renewal</th><th>Last contact</th></tr></thead>
                  <tbody id="membership-renewals-tbody"></tbody>
                </table>
              </div>
            </section>
          </section>

          <section id="membership-tab-summary" class="organizational-tab-content">
            <div class="organizational-membership-cards" id="membership-summary-cards" style="margin-top:12px;"></div>
            <h2 class="organizational-membership-section">Active by tier</h2>
            <div class="organizational-table-wrap"><table class="organizational-table" aria-label="Active by tier"><tbody id="membership-summary-tiers"></tbody></table></div>
          </section>

          <section id="membership-tab-tiers" class="organizational-tab-content">
            <div class="organizational-grants-head" style="margin-top:12px;justify-content:space-between;gap:8px;">
              <label class="organizational-hint"><input type="checkbox" id="tiers-show-archived"> Show archived</label>
              <button type="button" class="organizational-btn organizational-btn-primary" id="membership-tier-add" hidden>+ New tier</button>
            </div>
            <section class="organizational-card organizational-card-flush" style="margin-top:12px;">
              <div class="organizational-table-wrap">
                <table class="organizational-table" aria-label="Tiers">
                  <thead><tr><th>Tier</th><th>For</th><th>Price</th><th>Seats</th><th>Benefits</th><th></th></tr></thead>
                  <tbody id="membership-tiers-tbody"></tbody>
                </table>
              </div>
            </section>
          </section>

          <section id="membership-tab-settings" class="organizational-tab-content">
            <form id="membership-settings-form" class="organizational-card" style="margin-top:12px;max-width:720px;">
              <div class="organizational-panel-fields">
                <label class="organizational-label">Membership year
                  <select name="year_mode" class="organizational-select"><option value="rolling">Rolling: 12 months from joining</option><option value="fixed">Fixed year</option></select></label>
                <label class="organizational-label" data-fixed>Year starts (month and day)
                  <span style="display:flex;gap:6px;"><input name="fixed_start_month" type="number" min="1" max="12" class="organizational-input" style="width:70px;"><input name="fixed_start_day" type="number" min="1" max="31" class="organizational-input" style="width:70px;"></span></label>
                <label class="organizational-label">Renewal window (days before the next term)
                  <input name="renewal_window_days" type="number" min="0" max="366" class="organizational-input"></label>
                <label class="organizational-label" data-fixed>Joining mid-year
                  <select name="proration_mode" class="organizational-select"><option value="none">Full price</option><option value="monthly">Price for the months left</option></select></label>
                <label class="organizational-label">Grace period (days after a term ends)
                  <input name="grace_days" type="number" min="0" max="366" class="organizational-input"></label>
                <label class="organizational-label">Dues revenue
                  <select name="recognition_mode" class="organizational-select"><option value="spread">Spread evenly over the term</option><option value="at_receipt">At receipt</option></select>
                  <span class="organizational-hint">Check this choice with your accountant before the first posting.</span></label>
                <label class="organizational-label">Dues revenue account<select name="dues_revenue_account_id" class="organizational-select" data-accounts="income"></select></label>
                <label class="organizational-label">Dues received in advance (liability)<select name="deferred_dues_account_id" class="organizational-select" data-accounts="liability"></select></label>
                <label class="organizational-label">Contribution part of dues<select name="contribution_account_id" class="organizational-select" data-accounts="income"></select></label>
                <label class="organizational-label">Default program<select name="default_program_id" class="organizational-select" data-programs></select></label>
                <label class="organizational-panel-field-full" style="display:flex;gap:6px;align-items:center;font-size:0.875rem;"><input type="checkbox" name="auto_renew_default"> New terms renew automatically</label>
                <div class="organizational-panel-field-full organizational-membership-section">Public join form</div>
                <label class="organizational-panel-field-full" style="display:flex;gap:6px;align-items:center;font-size:0.875rem;"><input type="checkbox" name="join_form_enabled"> Accept joins from the public form</label>
                <label class="organizational-panel-field-full" style="display:flex;gap:6px;align-items:center;font-size:0.875rem;"><input type="checkbox" name="join_requires_approval"> Staff approve each join before the membership starts</label>
                <label class="organizational-panel-field-full" style="display:flex;gap:6px;align-items:center;font-size:0.875rem;"><input type="checkbox" name="extra_gift_enabled"> Offer an extra gift on the form</label>
                <div class="organizational-panel-field-full" style="font-size:0.875rem;">Also ask for:
                  <label style="margin-left:8px;"><input type="checkbox" data-form-field="phone"> Phone</label>
                  <label style="margin-left:8px;"><input type="checkbox" data-form-field="mailing_address"> Mailing address</label>
                  <label style="margin-left:8px;"><input type="checkbox" data-form-field="annual_budget"> Annual budget (organizations)</label>
                </div>
                <p class="organizational-hint organizational-panel-field-full" id="membership-public-links"></p>
              </div>
              <p id="membership-settings-msg" class="organizational-hint" hidden></p>
              <button type="submit" class="organizational-btn organizational-btn-primary">Save settings</button>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="membership-panel-overlay" class="organizational-panel-overlay"></div>
  <aside id="membership-panel" class="organizational-grant-panel organizational-grant-panel--wide" aria-label="Dues member">
    <div class="organizational-panel-header">
      <h3 id="membership-panel-title">Dues member</h3>
      <button type="button" id="membership-panel-close" class="organizational-panel-close" aria-label="Close panel">✕</button>
    </div>
    <div id="membership-panel-error" class="organizational-panel-error" hidden></div>
    <div class="organizational-panel-body" id="membership-panel-body"></div>
  </aside>

  <script src="/organizational/js/time-utils.js"></script>
  <script src="/organizational/js/utils.js"></script>
  <script src="/organizational/js/strings.js" defer></script>
  <script src="/organizational/js/sidebar.js" defer></script>
  <script src="/organizational/js/table-sort.js" defer></script>
  <script src="/organizational/js/membership.js" defer></script>
  <div id="organizational-overlay-container"></div>
  <script>
    fetch('/organizational/partials/organizational-overlay.html').then(r => r.text()).then(html => {
      document.getElementById('organizational-overlay-container').innerHTML = html;
    });
  </script>
  <script>
    fetch('/organizational/header.html').then(r => r.text()).then(html => {
      document.getElementById('app-header').innerHTML = html;
      document.body.style.visibility = 'visible';
    });
  </script>
  <script src="/shared/js/idle-logout.js"></script>
</body>
</html>

<!-- Cooperative Overlay Panels -->
<div id="organizational-overlay-members" class="organizational-overlay" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="organizational-overlay-content">
    <div class="organizational-overlay-header">
      <h2 class="organizational-overlay-title">Cooperative Members</h2>
      <button type="button" class="organizational-overlay-close" onclick="closeOrganizationalOverlay()" aria-label="Close">×</button>
    </div>
    <div class="organizational-overlay-body">
      <p class="organizational-overlay-hint">Other organizations in the cooperative.</p>
      <div id="organizational-overlay-members-list">
        <p class="organizational-empty">Loading member directory…</p>
      </div>
    </div>
  </div>
</div>

<div id="organizational-overlay-library" class="organizational-overlay" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="organizational-overlay-content">
    <div class="organizational-overlay-header">
      <h2 class="organizational-overlay-title">Cooperative Library</h2>
      <button type="button" class="organizational-overlay-close" onclick="closeOrganizationalOverlay()" aria-label="Close">×</button>
    </div>
    <div class="organizational-overlay-body">
      <div id="organizational-overlay-library-list">
        <p class="organizational-empty">Loading library…</p>
      </div>
    </div>
  </div>
</div>

<div id="organizational-overlay-work-pool" class="organizational-overlay" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="organizational-overlay-content">
    <div class="organizational-overlay-header">
      <h2 class="organizational-overlay-title">Cooperative Work Pool</h2>
      <button type="button" class="organizational-overlay-close" onclick="closeOrganizationalOverlay()" aria-label="Close">×</button>
    </div>
    <div class="organizational-overlay-body">
      <p class="organizational-overlay-hint">Post work your organization needs. Other cooperative members and pool workers can help.</p>
      <div id="organizational-overlay-work-pool-list">
        <p class="organizational-empty">Loading work pool…</p>
      </div>
    </div>
  </div>
</div>

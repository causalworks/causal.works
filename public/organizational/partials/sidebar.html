<script>
(function () {
  var m = (window.location.pathname || '').match(/^\/organizational\/o\/([^/]+)/);
  if (!m) return;
  var base = '/organizational/o/' + encodeURIComponent(decodeURIComponent(m[1]));
  document.querySelectorAll('.organizational-sidebar__link[data-organizational-route]').forEach(function (a) {
    var r = a.getAttribute('data-organizational-href-route') || a.getAttribute('data-organizational-route');
    a.href = base + '/' + (r === 'settings' ? 'settings/organization' : r.split('/').map(encodeURIComponent).join('/'));
  });
})();
</script>

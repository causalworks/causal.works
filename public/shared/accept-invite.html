    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Accept invite — Causal</title>
    <meta name="theme-color" content="#7c3aed">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #f5f3ff 0%, #faf8ff 100%);
        }
        .invite-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 20px rgba(0, 0, 0, 0.05);
            padding: 40px 32px;
        }
        .invite-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .invite-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 8px;
            letter-spacing: -0.5px;
        }
        .invite-header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }
        .invite-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .invite-form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .invite-form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            background: white;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .invite-form input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        .invite-form button {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .invite-form button:hover {
            background: #6d28d9;
        }
        .invite-form button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .invite-note {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 16px;
        }
        .invite-note a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .invite-note a:hover {
            text-decoration: underline;
        }
        .invite-error {
            padding: 12px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 13px;
            display: none;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="invite-container">
        <div class="invite-header">
            <h1>Causal</h1>
            <p id="invite-subtitle">Loading invite…</p>
        </div>
        <div class="invite-error" id="invite-error"></div>
        <div id="invite-body"></div>
    </div>

    <script>
        document.body.style.visibility = 'visible';

        function getToken() {
            return new URLSearchParams(window.location.search).get('token') || '';
        }

        function getInviteId() {
            return new URLSearchParams(window.location.search).get('invite_id') || '';
        }

        function showError(msg) {
            const el = document.getElementById('invite-error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function acceptInvite(password) {
            const token = getToken();
            const res = await fetch('/api/organizational/invites/' + encodeURIComponent(token) + '/accept', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(password ? { password } : {})
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.message || data.error || 'Could not accept invite.');
            }
            return data;
        }

        function renderNewAccountForm(invite) {
            const body = document.getElementById('invite-body');
            body.innerHTML =
                '<form class="invite-form" id="accept-form">' +
                '  <div><label>Email</label><input type="email" value="' + invite.email + '" disabled></div>' +
                '  <div><label for="password">Choose a password</label><input type="password" id="password" placeholder="At least 8 characters" minlength="8" required></div>' +
                '  <button type="submit">Create account &amp; join</button>' +
                '</form>';
            document.getElementById('accept-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                btn.disabled = true;
                btn.textContent = 'Joining…';
                try {
                    const data = await acceptInvite(document.getElementById('password').value);
                    window.location.href = '/organizational/o/' + encodeURIComponent(data.org_slug) + '/';
                } catch (err) {
                    showError(err.message);
                    btn.disabled = false;
                    btn.textContent = 'Create account & join';
                }
            });
        }

        function renderExistingAccountPrompt(invite) {
            const body = document.getElementById('invite-body');
            body.innerHTML =
                '<p class="invite-note">An account already exists for <strong>' + invite.email + '</strong>. ' +
                'Log in, then reopen this exact invite link to finish joining.</p>' +
                '<a href="/login"><button type="button">Go to login</button></a>';
        }

        async function renderLoggedInMismatch(invite, currentEmail) {
            const body = document.getElementById('invite-body');
            body.innerHTML =
                '<p class="invite-note">This invite is for <strong>' + invite.email + '</strong>, ' +
                'but you\'re logged in as <strong>' + currentEmail + '</strong>.</p>' +
                '<button type="button" id="logout-btn">Log out and try again</button>';
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await fetch('/auth/logout', { method: 'POST' });
                window.location.reload();
            });
        }

        async function acceptInviteById(inviteId) {
            const res = await fetch('/api/organizational/invites/mine/' + encodeURIComponent(inviteId) + '/accept', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.message || data.error || 'Could not accept invite.');
            }
            return data;
        }

        // Reached from the landing page's org list ("Review invite →") -- there is no raw
        // token to put in this URL (only its hash is ever stored server-side), so this path
        // is authenticated-by-id instead of token-based. Only valid when already logged in;
        // that's the whole reason it can skip the token.
        async function initById(inviteId) {
            document.getElementById('invite-subtitle').textContent = 'Joining…';
            let loggedIn = false;
            try {
                const meRes = await fetch('/api/me', { credentials: 'include' });
                loggedIn = meRes.ok;
            } catch (_) { /* treat as logged out */ }

            if (!loggedIn) {
                document.getElementById('invite-subtitle').textContent = 'Log in to accept this invite';
                document.getElementById('invite-body').innerHTML =
                    '<p class="invite-note">You need to be logged in to accept this invite.</p>' +
                    '<a href="/login"><button type="button">Go to login</button></a>';
                return;
            }

            document.getElementById('invite-body').innerHTML = '<p class="invite-note">Joining…</p>';
            try {
                const data = await acceptInviteById(inviteId);
                window.location.href = '/organizational/o/' + encodeURIComponent(data.org_slug) + '/';
            } catch (err) {
                document.getElementById('invite-subtitle').textContent = 'Could not join';
                showError(err.message);
            }
        }

        async function autoAccept(invite) {
            document.getElementById('invite-body').innerHTML = '<p class="invite-note">Joining ' + invite.org_display_name + '…</p>';
            try {
                const data = await acceptInvite(null);
                window.location.href = '/organizational/o/' + encodeURIComponent(data.org_slug) + '/';
            } catch (err) {
                showError(err.message);
            }
        }

        async function init() {
            const inviteId = getInviteId();
            if (inviteId) {
                await initById(inviteId);
                return;
            }

            const token = getToken();
            if (!token) {
                document.getElementById('invite-subtitle').textContent = 'Invalid invite link';
                showError('No invite token was found in this link.');
                return;
            }

            let invite;
            try {
                const res = await fetch('/api/organizational/invites/' + encodeURIComponent(token));
                const data = await res.json();
                if (!res.ok || !data.valid) {
                    document.getElementById('invite-subtitle').textContent = 'Invalid invite link';
                    showError(data.error || 'This invite link is invalid, expired, or already used.');
                    return;
                }
                invite = data;
            } catch (err) {
                document.getElementById('invite-subtitle').textContent = 'Invalid invite link';
                showError('Network error loading this invite.');
                return;
            }

            document.getElementById('invite-subtitle').textContent =
                'Join ' + invite.org_display_name + ' as ' + invite.role;

            // Soft-check current session so a logged-in matching user can auto-accept.
            let currentEmail = null;
            try {
                const meRes = await fetch('/api/me', { credentials: 'include' });
                if (meRes.ok) {
                    const me = await meRes.json();
                    currentEmail = me && me.email ? me.email : null;
                }
            } catch (_) { /* not logged in or endpoint unavailable — treat as logged out */ }

            if (currentEmail && currentEmail.toLowerCase() === invite.email.toLowerCase()) {
                await autoAccept(invite);
            } else if (currentEmail) {
                await renderLoggedInMismatch(invite, currentEmail);
            } else if (invite.account_exists) {
                renderExistingAccountPrompt(invite);
            } else {
                renderNewAccountForm(invite);
            }
        }

        init();
    </script>
</body>
</html>

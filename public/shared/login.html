<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in — Causal</title>
    <meta name="theme-color" content="#7c3aed">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/css/tokens.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #f5f3ff 0%, #faf8ff 100%);
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 20px rgba(0, 0, 0, 0.05);
            padding: 40px 32px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 8px;
            letter-spacing: -0.5px;
        }
        .login-header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .login-form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            background: white;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(60, 20, 22, 0.1);
        }
        .login-form button {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .login-form button:hover {
            background: var(--brand-dark);
        }
        .login-form button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .login-form-secondary {
            background: transparent;
            border: none;
            padding: 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--brand);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
        }
        .login-form-secondary:hover {
            text-decoration: underline;
            background: transparent;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .login-footer a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .login-error {
            padding: 12px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 13px;
            display: none;
        }
        .login-notice {
            padding: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            color: #166534;
            font-size: 13px;
            display: none;
        }
        .login-check {
            text-align: center;
            padding: 12px 0;
        }
        .login-check p:first-child {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px;
            color: var(--text-primary);
        }
        .login-check p:last-child {
            margin: 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Causal</h1>
            <p id="login-subhead">Sign in to your account</p>
        </div>
        <div class="login-error" id="login-error"></div>
        <div class="login-notice" id="login-notice"></div>
        <form class="login-form" id="login-form" onsubmit="handleSubmit(event)" autocomplete="on">
            <div>
                <label for="email">Email address</label>
                <input type="email" id="email" name="username" autocomplete="username" placeholder="your@email.com" required>
            </div>
            <div id="password-field" style="display:none;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password">
            </div>
            <button type="submit" id="submit-btn">Continue</button>
            <button type="button" class="login-form-secondary" id="change-email-btn" style="display:none;" onclick="resetToEmailStep()">Use a different email</button>
        </form>
        <div class="login-footer" id="password-footer" style="display:none;">
            <p style="margin: 0; margin-bottom: 12px;"><a href="#" onclick="handleForgotPassword(event)">Forgot password? Get a reset link →</a></p>
        </div>
    </div>

    <script>
        document.body.style.visibility = 'visible';

        // Step state: 'email' (only email shown) or 'password' (email decided, password revealed)
        let step = 'email';

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'expired') {
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = 'That link expired or was already used. Enter your email to get a new one.';
            errorEl.style.display = 'block';
        } else if (params.get('error') === 'idle') {
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = 'You were signed out after 15 minutes of inactivity. Sign in again to continue.';
            errorEl.style.display = 'block';
        }
        const prefillEmail = params.get('email');
        if (prefillEmail) {
            document.getElementById('email').value = prefillEmail;
        }

        // Offer the browser's saved password (Chrome/Edge Credential Management API) so
        // returning users can sign in without waiting on a magic link at all.
        async function tryStoredCredential() {
            if (!('credentials' in navigator) || !window.PasswordCredential) return;
            try {
                const cred = await navigator.credentials.get({ password: true, mediation: 'optional' });
                if (cred && cred.type === 'password' && !document.getElementById('email').value) {
                    document.getElementById('email').value = cred.id;
                    await handleEmailStep(cred.password);
                }
            } catch (err) {
                console.error('tryStoredCredential', err);
            }
        }
        tryStoredCredential();

        function resetToEmailStep() {
            step = 'email';
            document.getElementById('password-field').style.display = 'none';
            document.getElementById('password-footer').style.display = 'none';
            document.getElementById('change-email-btn').style.display = 'none';
            document.getElementById('submit-btn').textContent = 'Continue';
            document.getElementById('login-subhead').textContent = 'Sign in to your account';
            document.getElementById('email').readOnly = false;
            document.getElementById('email').focus();
            document.getElementById('login-error').style.display = 'none';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            if (step === 'email') {
                await handleEmailStep();
            } else {
                await handlePasswordLogin();
            }
        }

        async function handleEmailStep(knownPassword) {
            const email = document.getElementById('email').value.trim();
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('submit-btn');
            errorEl.style.display = 'none';

            if (!email) {
                errorEl.textContent = 'Please enter your email address';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Checking…';

            try {
                const res = await fetch('/auth/check-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json().catch(() => ({}));

                if (data.hasPassword) {
                    step = 'password';
                    document.getElementById('email').readOnly = true;
                    document.getElementById('password-field').style.display = 'block';
                    document.getElementById('password-footer').style.display = 'block';
                    document.getElementById('change-email-btn').style.display = 'block';
                    document.getElementById('login-subhead').textContent = 'Enter your password';
                    btn.textContent = 'Sign in';
                    btn.disabled = false;

                    if (knownPassword) {
                        document.getElementById('password').value = knownPassword;
                        await handlePasswordLogin();
                    } else {
                        document.getElementById('password').focus();
                    }
                    return;
                }

                // No password set yet — send a magic link instead.
                await requestMagicLink(email);
            } catch (err) {
                console.error('handleEmailStep', err);
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Continue';
            }
        }

        async function requestMagicLink(email) {
            try {
                await fetch('/request-access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
            } catch (err) {
                console.error('requestMagicLink', err);
            }
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('password-footer').style.display = 'none';
            const notice = document.getElementById('login-notice');
            notice.innerHTML = '<div class="login-check"><p>Check your email</p><p>We sent a sign-in link to ' + email + '</p></div>';
            notice.style.display = 'block';
        }

        async function handlePasswordLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('submit-btn');
            errorEl.style.display = 'none';

            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    const error = await res.json().catch(() => ({}));
                    errorEl.textContent = error.error || 'Error signing in. Try again.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign in';
                    return;
                }

                if ('credentials' in navigator && window.PasswordCredential) {
                    try {
                        await navigator.credentials.store(new PasswordCredential({ id: email, password }));
                    } catch (err) {
                        console.error('credentials.store', err);
                    }
                }

                window.location.href = '/app.html';
            } catch (err) {
                console.error('handlePasswordLogin', err);
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const errorEl = document.getElementById('login-error');
            if (!email) {
                errorEl.textContent = 'Enter your email address first.';
                errorEl.style.display = 'block';
                return;
            }
            try {
                await fetch('/auth/request-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('password-footer').style.display = 'none';
                const notice = document.getElementById('login-notice');
                notice.innerHTML = '<div class="login-check"><p>Check your email</p><p>We sent a password reset link to ' + email + '</p></div>';
                notice.style.display = 'block';
            } catch (err) {
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Set Password — Causal</title>
    <meta name="theme-color" content="#7c3aed">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/css/tokens.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #f5f3ff 0%, #faf8ff 100%);
        }
        .reset-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 20px rgba(0, 0, 0, 0.05);
            padding: 40px 32px;
        }
        .reset-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .reset-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 8px;
            letter-spacing: -0.5px;
        }
        .reset-header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }
        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .reset-form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .reset-form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            background: white;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .reset-form input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(60, 20, 22, 0.1);
        }
        .reset-form button {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .reset-form button:hover {
            background: var(--brand-dark);
        }
        .reset-form button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .reset-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .reset-footer a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }
        .reset-footer a:hover {
            text-decoration: underline;
        }
        .reset-error {
            padding: 12px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 13px;
            display: none;
        }
        .reset-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin: -8px 0 0;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1>Set your password</h1>
            <p id="reset-subhead">Choose a password for your account</p>
        </div>
        <div class="reset-error" id="reset-error"></div>
        <form class="reset-form" id="reset-form" method="POST" action="/auth/reset">
            <input type="hidden" name="token" id="token-field" value="">
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
                <p class="reset-hint">At least 8 characters.</p>
            </div>
            <div>
                <label for="password_confirm">Confirm password</label>
                <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" id="submit-btn">Set password</button>
        </form>
        <div class="reset-footer">
            <a href="/login.html">Back to sign in</a>
        </div>
    </div>

    <script>
        document.body.style.visibility = 'visible';

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const errorEl = document.getElementById('reset-error');

        const ERROR_MESSAGES = {
            expired: 'That reset link expired or was already used. Request a new one from the sign-in page.',
            mismatch: 'Those passwords do not match.',
            short: 'Password must be at least 8 characters.',
        };

        const errorCode = params.get('error');
        if (errorCode) {
            errorEl.textContent = ERROR_MESSAGES[errorCode] || 'Something went wrong. Please try again.';
            errorEl.style.display = 'block';
        }

        if (!token) {
            document.getElementById('reset-form').style.display = 'none';
            errorEl.textContent = ERROR_MESSAGES.expired;
            errorEl.style.display = 'block';
        } else {
            document.getElementById('token-field').value = token;
        }

        document.getElementById('reset-form').addEventListener('submit', function (e) {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('password_confirm').value;
            if (password !== confirm) {
                e.preventDefault();
                errorEl.textContent = ERROR_MESSAGES.mismatch;
                errorEl.style.display = 'block';
                return;
            }
            if (password.length < 8) {
                e.preventDefault();
                errorEl.textContent = ERROR_MESSAGES.short;
                errorEl.style.display = 'block';
                return;
            }
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').textContent = 'Saving…';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Shared document — causalworks</title>
    <meta name="theme-color" content="#7c3aed">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/css/tokens.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #f5f3ff 0%, #faf8ff 100%);
        }
        .share-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 20px rgba(0, 0, 0, 0.05);
            padding: 40px 32px;
        }
        .share-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .share-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 8px;
            letter-spacing: -0.5px;
        }
        .share-header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }
        .share-step {
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .share-step label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .share-step input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 20px;
            letter-spacing: 6px;
            text-align: center;
            color: var(--text-primary);
            background: white;
            font-family: inherit;
            box-sizing: border-box;
        }
        .share-step input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(60, 20, 22, 0.1);
        }
        .share-step button {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }
        .share-step button:hover {
            background: var(--brand-dark);
        }
        .share-step button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .share-link-button {
            background: none !important;
            color: var(--brand) !important;
            font-weight: 600;
            padding: 0 !important;
        }
        .share-link-button:hover {
            text-decoration: underline;
        }
        .share-error {
            padding: 12px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .share-note {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="share-container">
        <div class="share-header">
            <h1 id="share-title">Shared document</h1>
            <p id="share-subhead"></p>
        </div>
        <div class="share-error" id="share-error"></div>

        <div class="share-step" id="step-request">
            <p class="share-note">To make sure this reaches the right person, we will email a 6-digit code to <strong id="masked-email"></strong>.</p>
            <button type="button" id="request-btn">Email me a code</button>
        </div>

        <div class="share-step" id="step-code">
            <div>
                <label for="code-input">6-digit code</label>
                <input type="text" id="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
            </div>
            <button type="button" id="verify-btn">Open document</button>
            <button type="button" class="share-link-button" id="resend-btn">Send a new code</button>
        </div>

        <div class="share-step" id="step-open">
            <button type="button" id="open-btn">Open document</button>
            <p class="share-note">Access stays open in this browser for 30 minutes.</p>
        </div>

        <div class="share-step" id="step-dead">
            <p class="share-note">This link is no longer active. Ask the person who shared it to send a new one.</p>
        </div>
    </div>

    <script>
        document.body.style.visibility = 'visible';

        const token = window.location.pathname.split('/').filter(Boolean)[1] || '';
        const api = '/api/share/' + encodeURIComponent(token);
        const errorEl = document.getElementById('share-error');
        const steps = ['request', 'code', 'open', 'dead'];

        function showStep(name) {
            steps.forEach(function (s) {
                document.getElementById('step-' + s).style.display = s === name ? 'flex' : 'none';
            });
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = msg ? 'block' : 'none';
        }

        async function post(path, body) {
            const res = await fetch(api + path, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {})
            });
            const data = await res.json().catch(function () { return {}; });
            return { ok: res.ok, status: res.status, data: data };
        }

        async function requestCode(button) {
            showError('');
            button.disabled = true;
            const r = await post('/request-code');
            button.disabled = false;
            if (r.status === 404) return showStep('dead');
            if (!r.ok) return showError(r.data.error || 'Could not send the code.');
            showStep('code');
            document.getElementById('code-input').focus();
        }

        document.getElementById('request-btn').addEventListener('click', function () { requestCode(this); });
        document.getElementById('resend-btn').addEventListener('click', function () { requestCode(this); });

        document.getElementById('verify-btn').addEventListener('click', async function () {
            showError('');
            const btn = this;
            btn.disabled = true;
            const r = await post('/verify', { code: document.getElementById('code-input').value });
            btn.disabled = false;
            if (r.status === 404) return showStep('dead');
            if (!r.ok) return showError(r.data.error || 'That code did not work.');
            window.location.href = '/share/' + encodeURIComponent(token) + '/file';
        });

        document.getElementById('open-btn').addEventListener('click', function () {
            window.location.href = '/share/' + encodeURIComponent(token) + '/file';
        });

        (async function init() {
            try {
                const res = await fetch('/share/' + encodeURIComponent(token) + '/info', { credentials: 'same-origin' });
                if (!res.ok) return showStep('dead');
                const info = await res.json();
                document.getElementById('share-title').textContent = info.org_name + ' shared a document';
                document.getElementById('masked-email').textContent = info.masked_email;
                showStep(info.verified ? 'open' : 'request');
            } catch (e) {
                showStep('dead');
            }
        })();
    </script>
</body>
</html>

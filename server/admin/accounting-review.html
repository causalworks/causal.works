<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Accounting Module Review</title>
<link rel="stylesheet" href="/shared/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text-primary, #1a1a1a); background: var(--surface-page, #f7f7f5); }
  header { position: sticky; top: 0; z-index: 5; background: var(--surface-card, #fff); border-bottom: 1px solid var(--border, #e8e6e0); padding: 10px 16px; }
  .top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .top h1 { font-size: 17px; margin: 0; }
  .top a { color: var(--text-secondary, #5a5955); font-size: 13px; }
  .top .grow { flex: 1; }
  .top label { font-size: 12px; color: var(--text-secondary, #5a5955); display: flex; gap: 4px; align-items: center; }
  #status { font-size: 12px; color: var(--text-secondary, #5a5955); min-width: 90px; text-align: right; }
  #status.err { color: #b91c1c; font-weight: 600; }
  nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 8px; }
  nav button { flex: none; border: 1px solid var(--border, #e8e6e0); background: var(--surface-card, #fff); border-radius: var(--radius-sm, 6px); padding: 6px 10px; font: inherit; cursor: pointer; color: var(--text-secondary, #5a5955); }
  nav button.active { background: var(--text-primary, #1a1a1a); color: #fff; border-color: var(--text-primary, #1a1a1a); }
  nav .count { font-size: 11px; opacity: .75; margin-left: 4px; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar input[type=search], .bar select { padding: 6px 8px; border: 1px solid var(--border-strong, #d1cfc9); border-radius: var(--radius-sm, 6px); font: inherit; background: var(--surface-card, #fff); }
  .bar input[type=search] { flex: 1; min-width: 160px; }
  .bar label { font-size: 13px; color: var(--text-secondary, #5a5955); display: flex; gap: 4px; align-items: center; }
  .note { font-size: 13px; color: var(--text-secondary, #5a5955); margin: 0 0 12px; max-width: 80ch; }
  .card { background: var(--surface-card, #fff); border: 1px solid var(--border, #e8e6e0); border-radius: var(--radius-md, 10px); padding: 12px 14px; margin-bottom: 10px; }
  .card.done { border-left: 4px solid #15803d; }
  .card.differ { border-left: 4px solid #d97706; }
  .head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
  .id { font: 600 12px ui-monospace, monospace; color: var(--text-secondary, #5a5955); }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-active, #f0eee8); color: var(--text-secondary, #5a5955); }
  .chip.who { background: #e0e7ff; color: #3730a3; }
  .chip.ok { background: #dcfce7; color: #166534; }
  .chip.diff { background: #fef3c7; color: #92400e; }
  .title { font-weight: 600; }
  .what { margin: 6px 0 0; }
  .meta { margin: 4px 0 0; font-size: 12px; color: var(--text-secondary, #5a5955); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border, #e8e6e0); }
  .fields .wide { grid-column: 1 / -1; }
  .fields label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--text-secondary, #5a5955); margin-bottom: 2px; }
  .fields .sh label::after { content: " · shared"; text-transform: none; font-weight: 400; }
  .fields select, .fields textarea, .fields input { width: 100%; padding: 6px 8px; border: 1px solid var(--border-strong, #d1cfc9); border-radius: var(--radius-sm, 6px); font: inherit; background: #fffdf3; }
  .fields .sh select, .fields .sh textarea, .fields .sh input { background: var(--surface-card, #fff); }
  .fields textarea { min-height: 54px; resize: vertical; }
  .fields [disabled] { background: var(--surface-active, #f0eee8) !important; color: var(--text-muted, #9ca3af); cursor: not-allowed; }
  .oth { margin-top: 10px; padding: 8px 10px; background: var(--surface-page, #f7f7f5); border-radius: var(--radius-sm, 6px); font-size: 13px; }
  .oth + .oth { margin-top: 6px; }
  .oth .kv { margin: 3px 0 0; }
  .oth .kv b { font-weight: 600; color: var(--text-secondary, #5a5955); }
  .oth.hidden { color: var(--text-secondary, #5a5955); font-style: italic; }
  .cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 10px; }
  .cmp .oth { margin: 0; }
  .cmp .oth.me { background: #fffdf3; }
  button.act { border: 1px solid var(--border-strong, #d1cfc9); background: var(--surface-card, #fff); border-radius: var(--radius-sm, 6px); padding: 6px 12px; font: inherit; cursor: pointer; }
  button.act:hover { background: var(--surface-hover, #f7f5f0); }
  button.del { color: #991b1b; border-color: #fecaca; margin-left: auto; font-size: 12px; padding: 2px 8px; }
  .readme p { margin: 0 0 8px; max-width: 80ch; }
  .readme h2 { font-size: 14px; margin: 18px 0 6px; color: #1f3a5f; }
  .readme h1 { font-size: 20px; margin: 0 0 8px; }
  .empty { color: var(--text-secondary, #5a5955); padding: 20px 0; }
  h3.sec { font-size: 14px; margin: 18px 0 8px; }
  @media (max-width: 640px) { main { padding: 12px; } #status { text-align: left; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Accounting module review</h1>
    <a href="/admin">&larr; Admin</a>
    <span class="grow"></span>
    <label title="Normally the other person's answers stay hidden on each card until you've answered it yourself."><input type="checkbox" id="peek"> Show their answers before I answer</label>
    <span id="status">Loading…</span>
    <button class="act" id="export" type="button">Export CSV</button>
  </div>
  <nav id="tabs" aria-label="Review sections"></nav>
</header>
<main id="main"></main>

<script>
(function () {
  var WORKS = ["Works as I'd expect", "Works but clunky", "Wrong / confusing", "Missing something", "Haven't tested"];
  var NEED = ["Must have now", "Soon", "Nice to have", "Don't need", "Unsure"];
  var FREQ = ["Daily", "Weekly", "Monthly", "Yearly", "Rarely"];
  var BUILD = ["Not started", "In progress", "Shipped", "Dropped"];
  var YESNO = ["Yes", "No", "N/A"];
  var SHARED = 'shared';

  // t: s = select, t = textarea, i = input. sh = shared by both reviewers; otherwise it's per person.
  var TABS = [
    { key: 'readme', label: 'Start here' },
    { key: 'built', label: 'Built', fixed: 1, fields: [
      { k: 'works', l: 'Does it work?', t: 's', o: WORKS },
      { k: 'priority', l: 'Priority to fix', t: 's', o: NEED },
      { k: 'comments', l: 'Comments / what you would change', t: 't', wide: 1 },
      { k: 'decision', l: 'Decision', t: 't', wide: 1, sh: 1 } ] },
    { key: 'planned', label: 'Planned, unbuilt', fixed: 1, fields: [
      { k: 'priority', l: 'How much does this matter?', t: 's', o: NEED },
      { k: 'comments', l: 'Comments', t: 't', wide: 1 },
      { k: 'decision', l: 'Decision', t: 't', wide: 1, sh: 1 } ] },
    { key: 'ideas', label: 'Ideas', fixed: 1, fields: [
      { k: 'priority', l: 'How much does this matter?', t: 's', o: NEED },
      { k: 'comments', l: 'Comments / how you do it today', t: 't', wide: 1 },
      { k: 'decision', l: 'Decision', t: 't', wide: 1, sh: 1 } ] },
    { key: 'questions', label: 'Questions', fixed: 1, fields: [
      { k: 'answer', l: 'Answer', t: 't', wide: 1 },
      { k: 'reasoning', l: 'Reasoning / source', t: 't', wide: 1 },
      { k: 'decision', l: 'Decision', t: 't', wide: 1, sh: 1 } ] },
    { key: 'additions', label: 'Your additions', add: 'A', fields: [
      { k: 'area', l: 'Area', t: 'i' },
      { k: 'frequency', l: 'How often?', t: 's', o: FREQ },
      { k: 'priority', l: 'Priority', t: 's', o: NEED },
      { k: 'issue', l: 'What is missing or wrong', t: 't', wide: 1 },
      { k: 'example', l: 'Example / how you handle it today', t: 't', wide: 1 },
      { k: 'response', l: 'Response', t: 't', wide: 1, sh: 1 } ] },
    { key: 'compare', label: 'Compare' },
    { key: 'log', label: 'Decision log', add: 'L', fields: [
      { k: 'date', l: 'Date', t: 'i', sh: 1 }, { k: 'items', l: 'Item IDs', t: 'i', sh: 1 },
      { k: 'who', l: 'Who decided', t: 'i', sh: 1 },
      { k: 'decision', l: 'Decision', t: 't', wide: 1, sh: 1 }, { k: 'why', l: 'Reasoning', t: 't', wide: 1, sh: 1 },
      { k: 'build', l: 'Build status', t: 's', o: BUILD, sh: 1 }, { k: 'verified', l: 'Verified?', t: 's', o: YESNO, sh: 1 } ] }
  ];
  var ANSWER_KEYS = ['works', 'priority', 'answer', 'comments', 'issue'];

  var content = null, entries = {}, me = '', canDecide = false, active = 'readme';
  var filt = { q: '', area: '', open: false, cmp: 'any' };
  var timers = {}, pending = {};
  var statusEl = document.getElementById('status');
  var peekEl = document.getElementById('peek');
  try { peekEl.checked = localStorage.getItem('acr_peek') === '1'; } catch (e) { /* storage blocked */ }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function tabDef(k) { return TABS.filter(function (t) { return t.key === k; })[0]; }
  function setStatus(msg, err) { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; }
  function nameOf(r) { return r === me ? 'You' : (r === SHARED ? 'Shared' : r.split('@')[0]); }
  function rowOf(id, r) { return (entries[id] && entries[id][r]) || null; }
  function mineD(id) { return rowOf(id, me) || {}; }
  function hasAnswer(d) { return !!d && ANSWER_KEYS.some(function (k) { return d[k]; }); }
  function isDone(id) { return hasAnswer(mineD(id)); }
  function othersOf(id) {
    var e = entries[id] || {};
    return Object.keys(e).filter(function (r) { return r !== me && r !== SHARED && hasAnswer(e[r]); }).sort();
  }
  function selectFields(def) { return def.fields.filter(function (f) { return f.t === 's' && !f.sh; }); }
  function differs(def, id) {
    var m = mineD(id);
    return othersOf(id).some(function (r) {
      var o = rowOf(id, r);
      return selectFields(def).some(function (f) { return m[f.k] && o[f.k] && m[f.k] !== o[f.k]; });
    });
  }

  function itemsFor(key) {
    if (key === 'additions') {
      return Object.keys(entries).filter(function (id) { return id.indexOf('A-') === 0 && entries[id][me]; }).sort().map(function (id) { return { id: id }; });
    }
    if (key === 'log') {
      return Object.keys(entries).filter(function (id) { return id.indexOf('L-') === 0; }).sort().map(function (id) { return { id: id }; });
    }
    return content[key] || [];
  }
  function titleOf(it) { return it.feature || it.item || it.idea || it.question || ''; }
  function whatOf(it) { return it.question ? (it.why ? 'Why I\'m asking: ' + it.why : '') : (it.what || it.why || ''); }

  function compareItems() {
    var out = [];
    TABS.forEach(function (def) {
      if (!def.fixed) return;
      content[def.key].forEach(function (it) {
        var mineDone = isDone(it.id), oth = othersOf(it.id);
        if (!mineDone && !oth.length) return;
        out.push({ def: def, it: it, mineDone: mineDone, oth: oth, differ: differs(def, it.id) });
      });
    });
    return out;
  }

  function renderTabs() {
    var h = '';
    TABS.forEach(function (t) {
      var n = '';
      if (t.fixed) {
        var its = itemsFor(t.key);
        n = '<span class="count">' + its.filter(function (i) { return isDone(i.id); }).length + '/' + its.length + '</span>';
      } else if (t.add) {
        n = '<span class="count">' + itemsFor(t.key).length + '</span>';
      } else if (t.key === 'compare') {
        var d = compareItems().filter(function (c) { return c.differ; }).length;
        if (d) n = '<span class="count">' + d + ' differ</span>';
      }
      h += '<button type="button" data-tab="' + t.key + '" class="' + (t.key === active ? 'active' : '') + '">' + esc(t.label) + n + '</button>';
    });
    document.getElementById('tabs').innerHTML = h;
  }

  function fieldHtml(f, id, val, off) {
    if (f.sh && !canDecide) off = 'decision';
    var cls = (f.sh ? 'sh' : 'mine') + (f.wide ? ' wide' : '');
    var dom = 'f_' + id + '_' + f.k;
    var attrs = ' id="' + dom + '" data-id="' + id + '" data-k="' + f.k + '" data-scope="' + (f.sh ? 'shared' : 'mine') + '"';
    var inner;
    if (f.t === 's') {
      inner = '<select' + attrs + (off ? ' disabled' : '') + '><option value=""></option>' +
        f.o.map(function (o) { return '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    } else if (f.t === 'i') {
      inner = '<input' + attrs + ' value="' + esc(val) + '" maxlength="4000"' + (off ? ' disabled' : '') + '>';
    } else {
      inner = '<textarea' + attrs + ' maxlength="4000"' + (off ? ' disabled placeholder="' + (off === 'decision' ? 'Only the admin enters decisions' : 'Write your answer first') + '"' : '') + '>' + esc(val) + '</textarea>';
    }
    return '<div class="' + cls + '"><label for="' + dom + '">' + esc(f.l) + '</label>' + inner + '</div>';
  }

  function valuesHtml(def, d) {
    var rows = def.fields.filter(function (f) { return !f.sh && d[f.k]; }).map(function (f) {
      return '<div class="kv"><b>' + esc(f.l) + ':</b> ' + esc(d[f.k]) + '</div>';
    });
    return rows.join('') || '<div class="kv">No answer yet.</div>';
  }

  function agreeChips(def, id, r) {
    var m = mineD(id), o = rowOf(id, r) || {}, h = '';
    selectFields(def).forEach(function (f) {
      if (m[f.k] && o[f.k]) h += ' <span class="chip ' + (m[f.k] === o[f.k] ? 'ok' : 'diff') + '">' + (m[f.k] === o[f.k] ? 'agree' : 'differ') + ': ' + esc(f.l) + '</span>';
    });
    return h;
  }

  function othersBlock(def, id) {
    var oth = othersOf(id);
    if (!oth.length) return '';
    if (!isDone(id) && !peekEl.checked) {
      return '<div class="oth hidden">' + oth.length + (oth.length === 1 ? ' other answer is' : ' other answers are') + ' hidden until you answer this one.</div>';
    }
    return oth.map(function (r) {
      return '<div class="oth"><span class="chip who">' + esc(nameOf(r)) + '</span>' + agreeChips(def, id, r) + valuesHtml(def, rowOf(id, r)) + '</div>';
    }).join('');
  }

  function cardHtml(def, it) {
    var d = mineD(it.id), sd = rowOf(it.id, SHARED) || {};
    var cls = 'card' + (def.fixed && isDone(it.id) ? (differs(def, it.id) ? ' differ' : ' done') : '');
    var h = '<div class="' + cls + '" data-card="' + it.id + '"><div class="head">';
    h += '<span class="id">' + esc(it.id.indexOf('-') > 0 ? (def.key === 'log' ? 'Log' : 'Added') : it.id) + '</span>';
    if (it.area) h += '<span class="chip">' + esc(it.area) + '</span>';
    if (it.topic) h += '<span class="chip">' + esc(it.topic) + '</span>';
    var t = titleOf(it);
    if (t) h += '<span class="title">' + esc(t) + '</span>';
    if (def.add && !(def.key === 'log' && !canDecide)) h += '<button type="button" class="act del" data-del="' + it.id + '">Delete</button>';
    h += '</div>';
    var w = whatOf(it);
    if (w) h += '<p class="what">' + esc(w) + '</p>';
    var meta = [];
    if (it.confidence) meta.push('Confidence: ' + it.confidence);
    if (it.status) meta.push('Status: ' + it.status);
    if (it.size) meta.push('Rough size: ' + it.size);
    if (it.source) meta.push('Source: ' + it.source);
    if (meta.length) h += '<p class="meta">' + esc(meta.join(' · ')) + '</p>';
    h += '<div class="fields">' + def.fields.map(function (f) { return fieldHtml(f, it.id, (f.sh ? sd : d)[f.k] || '', f.k === 'reasoning' && !d.answer); }).join('') + '</div>';
    if (def.fixed) h += othersBlock(def, it.id);
    return h + '</div>';
  }

  function renderReadme() {
    var h = '<div class="readme">';
    content.readme.forEach(function (r) {
      if (r.kind === 'title') h += '<h1>' + esc(r.text) + '</h1>';
      else if (r.kind === 'h') h += '<h2>' + esc(r.text) + '</h2>';
      else h += '<p>' + esc(r.text) + '</p>';
    });
    h += '<h2>TWO OF US, SEPARATE ANSWERS</h2>';
    h += '<p>Each of us has our own answers, saved under our own login. You can\'t overwrite each other. Decisions, responses and the decision log are shared by both of us, and only the admin enters them. The rest is greyed out for everyone else.</p>';
    h += '<p>On each card, the other person\'s answer stays hidden until you\'ve answered it yourself, so we don\'t anchor on each other. (The checkbox at the top turns that off.) The Compare tab puts everyone\'s answers side by side and flags where they differ.</p>';
    h += '<p>Answers save as you type and are stored in the database.</p></div>';
    return h;
  }

  function compareCardHtml(c) {
    var def = c.def, it = c.it, id = it.id, sd = rowOf(id, SHARED) || {};
    var reviewers = [me].concat(othersOf(id));
    var h = '<div class="card' + (c.differ ? ' differ' : '') + '"><div class="head"><span class="id">' + esc(id) + '</span>';
    h += '<span class="chip">' + esc(def.label) + '</span>';
    if (it.area || it.topic) h += '<span class="chip">' + esc(it.area || it.topic) + '</span>';
    h += '<span class="title">' + esc(titleOf(it)) + '</span>';
    if (c.differ) h += '<span class="chip diff">differ</span>';
    h += '</div>';
    var w = whatOf(it);
    if (w) h += '<p class="what">' + esc(w) + '</p>';
    h += '<div class="cmp">' + reviewers.map(function (r) {
      var d = rowOf(id, r) || {};
      return '<div class="oth' + (r === me ? ' me' : '') + '"><span class="chip who">' + esc(nameOf(r)) + '</span>' + valuesHtml(def, d) + '</div>';
    }).join('') + '</div>';
    var shared = def.fields.filter(function (f) { return f.sh; });
    h += '<div class="fields">' + shared.map(function (f) { return fieldHtml(f, id, sd[f.k] || ''); }).join('') + '</div></div>';
    return h;
  }

  function renderCompare() {
    var all = compareItems();
    var people = {};
    Object.keys(entries).forEach(function (id) { Object.keys(entries[id]).forEach(function (r) { if (r !== SHARED) people[r] = 1; }); });
    var h = '<p class="note">Everyone\'s answers side by side. Amber means two people picked different ratings. Decisions are shared, and only the admin can enter them.</p>';
    h += '<div class="bar"><select id="cmpf">' + [['any', 'Everything answered'], ['differ', 'Where we differ'], ['theirs', 'They answered, I haven\'t'], ['mine', 'I answered, they haven\'t']].map(function (o) {
      return '<option value="' + o[0] + '"' + (filt.cmp === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select></div>';
    if (Object.keys(people).length < 2) h += '<p class="note">Only one person has answered anything so far, so there is nothing to compare yet.</p>';
    var shown = all.filter(function (c) {
      if (filt.cmp === 'differ') return c.differ;
      if (filt.cmp === 'theirs') return !c.mineDone && c.oth.length;
      if (filt.cmp === 'mine') return c.mineDone && !c.oth.length;
      return true;
    });
    h += shown.length ? shown.map(compareCardHtml).join('') : '<p class="empty">Nothing matches.</p>';
    // everyone's additions
    var adds = Object.keys(entries).filter(function (id) { return id.indexOf('A-') === 0; }).sort();
    var addDef = tabDef('additions');
    h += '<h3 class="sec">Added gaps and suggestions (' + adds.length + ')</h3>';
    if (!adds.length) h += '<p class="empty">None yet.</p>';
    adds.forEach(function (id) {
      var owner = Object.keys(entries[id]).filter(function (r) { return r !== SHARED; })[0] || '';
      var d = rowOf(id, owner) || {}, sd = rowOf(id, SHARED) || {};
      h += '<div class="card"><div class="head"><span class="chip who">' + esc(nameOf(owner)) + '</span><span class="chip">' + esc(d.area || 'No area') + '</span></div>';
      h += '<div class="kv">' + valuesHtml(addDef, d) + '</div>';
      h += '<div class="fields">' + fieldHtml(addDef.fields[addDef.fields.length - 1], id, sd.response || '') + '</div></div>';
    });
    return h;
  }

  function listHtml(def, its) {
    var q = filt.q.toLowerCase();
    var shown = its.filter(function (it) {
      if (def.add) return true;
      if (filt.area && (it.area || it.topic) !== filt.area) return false;
      if (filt.open && isDone(it.id)) return false;
      if (q && JSON.stringify(it).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!shown.length) return '<p class="empty">' + (def.add ? 'Nothing here yet.' : 'No items match.') + '</p>';
    return shown.map(function (it) { return cardHtml(def, it); }).join('');
  }

  function render() {
    renderTabs();
    var main = document.getElementById('main');
    if (active === 'readme') { main.innerHTML = renderReadme(); return; }
    if (active === 'compare') { main.innerHTML = renderCompare(); return; }
    var def = tabDef(active), its = itemsFor(active), h = '';
    var areas = {};
    its.forEach(function (i) { var a = i.area || i.topic; if (a) areas[a] = 1; });
    h += '<div class="bar">';
    if (def.add) {
      var locked = def.add === 'L' && !canDecide;
      h += '<button type="button" class="act" id="add"' + (locked ? ' disabled' : '') + '>+ Add ' + (def.add === 'A' ? 'a gap or suggestion' : 'a decision') + '</button>';
      if (locked) h += '<span class="note" style="margin:0">Only the admin can add decisions.</span>';
    } else {
      h += '<input type="search" id="q" placeholder="Search…" value="' + esc(filt.q) + '">';
      h += '<select id="area"><option value="">All areas</option>' + Object.keys(areas).sort().map(function (a) { return '<option' + (a === filt.area ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select>';
      h += '<label><input type="checkbox" id="open"' + (filt.open ? ' checked' : '') + '> Unanswered only</label>';
    }
    h += '</div><div id="list">' + listHtml(def, its) + '</div>';
    main.innerHTML = h;
  }

  // Only the fields that changed since the last save are sent, so a save never overwrites
  // fields someone else edited in the meantime.
  function collect(id, scope, keys) {
    var out = {};
    document.querySelectorAll('[data-id="' + id + '"][data-scope="' + scope + '"]').forEach(function (el) {
      var k = el.getAttribute('data-k');
      if (keys[k]) out[k] = el.value;
    });
    return out;
  }

  // Pull everyone's latest rows, keeping any row of mine that has unsaved edits.
  function refreshEntries() {
    return fetch('/admin/api/accounting-review', { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        var fresh = {};
        j.entries.forEach(function (r) { fresh[r.item_id] = fresh[r.item_id] || {}; fresh[r.item_id][r.reviewer] = r.data || {}; });
        Object.keys(pending).forEach(function (key) {
          var parts = key.split('|'), id = parts[0], who = parts[1] === 'mine' ? me : SHARED;
          if (entries[id] && entries[id][who]) { fresh[id] = fresh[id] || {}; fresh[id][who] = entries[id][who]; }
        });
        entries = fresh;
      }).catch(function () { /* keep what we have */ });
  }

  function api(method, id, body) {
    return fetch('/admin/api/accounting-review/' + encodeURIComponent(id), {
      method: method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function save(id, scope) {
    var key = id + '|' + scope, data = collect(id, scope, pending[key] || {});
    delete timers[key];
    setStatus('Saving…');
    api('PUT', id, { scope: scope, data: data }).then(function (out) {
      entries[id] = entries[id] || {};
      entries[id][scope === 'mine' ? me : SHARED] = out.data;
      delete pending[key];
      setStatus(Object.keys(pending).length ? 'Unsaved changes…' : 'Saved ' + new Date().toLocaleTimeString());
      var card = document.querySelector('[data-card="' + id + '"]');
      var def = tabDef(active);
      if (card && def && def.fixed) {
        // Re-evaluate the "others" block (it unhides once you've answered) and the card colour.
        card.querySelectorAll('.oth').forEach(function (el) { el.remove(); });
        card.insertAdjacentHTML('beforeend', othersBlock(def, id));
        card.classList.remove('done', 'differ');
        if (isDone(id)) card.classList.add(differs(def, id) ? 'differ' : 'done');
      }
      renderTabs();
    }).catch(function (e) { setStatus('Not saved: ' + e.message, true); });
  }

  function schedule(id, scope, k) {
    var key = id + '|' + scope;
    pending[key] = pending[key] || {};
    pending[key][k] = true;
    setStatus('Unsaved changes…');
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () { save(id, scope); }, 700);
  }

  var mainEl = document.getElementById('main');
  function refreshList() { document.getElementById('list').innerHTML = listHtml(tabDef(active), itemsFor(active)); }

  mainEl.addEventListener('input', function (e) {
    var id = e.target.getAttribute && e.target.getAttribute('data-id');
    if (id) {
      var k = e.target.getAttribute('data-k'), scope = e.target.getAttribute('data-scope');
      schedule(id, scope, k);
      if (k === 'answer') {
        // Reasoning only goes with an answer.
        var why = document.getElementById('f_' + id + '_reasoning');
        if (why) {
          why.disabled = !e.target.value;
          why.placeholder = e.target.value ? '' : 'Write your answer first';
          if (!e.target.value && why.value) { why.value = ''; schedule(id, scope, 'reasoning'); }
        }
      }
      return;
    }
    if (e.target.id === 'q') { filt.q = e.target.value; refreshList(); }
  });
  mainEl.addEventListener('change', function (e) {
    if (e.target.id === 'area') { filt.area = e.target.value; refreshList(); }
    if (e.target.id === 'open') { filt.open = e.target.checked; refreshList(); }
    if (e.target.id === 'cmpf') { filt.cmp = e.target.value; render(); }
  });
  mainEl.addEventListener('click', function (e) {
    if (e.target.id === 'add') {
      var def = tabDef(active), id = def.add + '-' + Date.now(), scope = def.add === 'A' ? 'mine' : 'shared';
      api('PUT', id, { scope: scope, data: {} }).then(function () {
        entries[id] = {}; entries[id][scope === 'mine' ? me : SHARED] = {};
        render();
        var f = document.querySelector('[data-id="' + id + '"]'); if (f) f.focus();
      }).catch(function (err) { setStatus('Not saved: ' + err.message, true); });
    }
    var del = e.target.getAttribute && e.target.getAttribute('data-del');
    if (del && confirm('Delete this row?')) {
      api('DELETE', del).then(function () { delete entries[del]; render(); })
        .catch(function (err) { setStatus('Not deleted: ' + err.message, true); });
    }
  });
  document.getElementById('tabs').addEventListener('click', function (e) {
    var k = e.target.closest && e.target.closest('button[data-tab]');
    if (k) {
      active = k.getAttribute('data-tab'); filt = { q: '', area: '', open: false, cmp: 'any' };
      render(); window.scrollTo(0, 0);
      // Other people may have added answers since this page loaded.
      if (active !== 'readme') refreshEntries().then(function () { if (!Object.keys(pending).length) render(); });
    }
  });
  peekEl.addEventListener('change', function () {
    try { localStorage.setItem('acr_peek', peekEl.checked ? '1' : '0'); } catch (e) { /* storage blocked */ }
    render();
  });

  document.getElementById('export').addEventListener('click', function () {
    var rows = [['Tab', 'ID', 'Area/Topic', 'Item', 'Person', 'Field', 'Value']];
    TABS.forEach(function (def) {
      if (!def.fields) return;
      var ids = def.fixed ? content[def.key] : Object.keys(entries).filter(function (id) { return id.indexOf(def.add + '-') === 0; }).sort().map(function (id) { return { id: id }; });
      ids.forEach(function (it) {
        Object.keys(entries[it.id] || {}).forEach(function (r) {
          var d = entries[it.id][r];
          def.fields.forEach(function (f) {
            if (d[f.k]) rows.push([def.label, it.id, it.area || it.topic || '', titleOf(it), nameOf(r), f.l, d[f.k]]);
          });
        });
      });
    });
    var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'accounting-review-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
  });

  window.addEventListener('beforeunload', function (e) {
    if (Object.keys(pending).length) { e.preventDefault(); e.returnValue = ''; }
  });

  fetch('/admin/api/accounting-review', { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      content = j.content; me = j.me; canDecide = !!j.can_decide;
      j.entries.forEach(function (r) { entries[r.item_id] = entries[r.item_id] || {}; entries[r.item_id][r.reviewer] = r.data || {}; });
      setStatus('Loaded');
      render();
    })
    .catch(function (e) { setStatus('Could not load: ' + e.message, true); });
})();
</script>
</body>
</html>
